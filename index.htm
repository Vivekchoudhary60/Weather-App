<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App UI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🌤 Weather App</h1>

        <div class="search">
            <input value="" type="text" class="input" placeholder="Enter city name">
            <button class="btn">Search</button>
        </div>

        <div class="main">
            <div class="city">City Name</div>
            <div class="temp">-°C</div>
            <div class="status">Sunny</div>
        </div>

        <div class="info-grid">
            <div class="card">
                <div class="label ">State</div>
                <div class="value state ">-</div>
            </div>

            <div class="card">
                <div class="label">Country</div>
                <div class="value country">-</div>
            </div>

            <div class="card">
                <div class="label">Latitude</div>
                <div class="value Latitude">-</div>
            </div>

            <div class="card">
                <div class="label">Longitude</div>
                <div class="value Longitude">-</div>
            </div>

            <div class="card">
                <div class="label">Wind Speed</div>
                <div class="value Wind-Speed">-</div>
            </div>

            <div class="card">
                <div class="label">Time Zone</div>
                <div class="value Time">-</div>
            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
